{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: tokenark
---
{{- end }}
{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: pg-secret
  namespace: {{ .Values.namespace.name }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
{{- end }}
