apiVersion: v1
kind: Service
metadata:
  name: tokenark-app
  namespace: {{ .Values.namespace.name }}
spec:
  type: {{ .Values.service.type }}
  selector: { app: tokenark-app }
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8099
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
