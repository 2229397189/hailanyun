# TokenArk 平台自身的 K8s 部署清单
# 目标：证明「平台组件也跑在 K8s 里」，而不只是管理别人的 Pod
apiVersion: v1
kind: Namespace
metadata:
  name: tokenark
  labels:
    app.kubernetes.io/name: tokenark
---
apiVersion: v1
kind: Secret
metadata:
  name: pg-secret
  namespace: tokenark
type: Opaque
stringData:
  POSTGRES_PASSWORD: rental_pwd
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-data
  namespace: tokenark
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: tokenark
  labels: {app: postgres}
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: rental
            - name: POSTGRES_USER
              value: rental
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: pg-secret, key: POSTGRES_PASSWORD}
            - name: TZ
              value: Asia/Shanghai
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "rental", "-d", "rental"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pg-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tokenark
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
      targetPort: 5432
---
# ---------- RBAC：平台需要管理租户命名空间、Pod 与配额 ----------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tokenark-app
  namespace: tokenark
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tokenark-app
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tokenark-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tokenark-app
subjects:
  - kind: ServiceAccount
    name: tokenark-app
    namespace: tokenark
---
# ---------- 平台应用 ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tokenark-app
  namespace: tokenark
  labels: {app: tokenark-app}
spec:
  replicas: 1
  selector:
    matchLabels: {app: tokenark-app}
  template:
    metadata:
      labels: {app: tokenark-app}
    spec:
      serviceAccountName: tokenark-app
      containers:
        - name: app
          image: gpu-rental-skeleton-app:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: RENTAL_K8S_MODE
              value: real
            - name: RENTAL_K8S_IMAGE
              value: busybox:1.36
            - name: TZ
              value: Asia/Shanghai
          ports:
            - containerPort: 8099
          readinessProbe:
            httpGet: {path: /api/health, port: 8099}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: 8099}
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: tokenark-app
  namespace: tokenark
spec:
  type: NodePort
  selector: {app: tokenark-app}
  ports:
    - port: 8099
      targetPort: 8099
      nodePort: 30080
