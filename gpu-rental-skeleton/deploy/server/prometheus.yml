global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: tokenark-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app:8099']
        labels:
          instance: 'app'

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
