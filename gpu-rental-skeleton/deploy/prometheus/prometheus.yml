global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 平台业务指标：JVM / HTTP 请求 / 连接池 + 自定义业务 Gauge
  - job_name: gpu-rental-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app:8099']
        labels:
          instance: 'app'

  # 主机指标：CPU / 内存 / 磁盘 / 网络
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
