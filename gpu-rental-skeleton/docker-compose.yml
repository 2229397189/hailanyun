services:
  postgres:
    image: postgres:16-alpine
    container_name: gpu-rental-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: rental
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental_pwd
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d rental"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "5433:5432"

  app:
    build: .
    container_name: gpu-rental-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8099' || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 25s
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: Asia/Shanghai
      # 默认 fake：不依赖任何 K8s 集群，开箱即跑
      # 要连真集群：docker compose -f docker-compose.yml -f docker-compose.real.yml up -d
      RENTAL_K8S_MODE: ${RENTAL_K8S_MODE:-fake}
      RENTAL_KUBECONFIG: /kubeconfig
      RENTAL_K8S_IMAGE: busybox:1.36
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8099:8099"

  # ---------- 入口：nginx 终止 TLS ----------
  nginx:
    image: nginx:1.27-alpine
    container_name: gpu-rental-nginx
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 4s
      retries: 3
      start_period: 10s
    ports:
      - "80:80"
      - "443:443"

  # ---------- 开源可观测栈 ----------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: gpu-rental-prom
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: gpu-rental-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: TokenArk@2026
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      TZ: Asia/Shanghai
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: gpu-rental-node-exp
    restart: unless-stopped
    ports:
      - "9100:9100"

  # ---------- 开源私有镜像仓库（离线交付用） ----------
  registry:
    image: registry:2
    container_name: gpu-rental-registry
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registrydata:/var/lib/registry
    ports:
      - "5000:5000"

  # ---------- 数据库定时备份（每 24h，保留 7 天） ----------
  backup:
    image: postgres:16-alpine
    container_name: gpu-rental-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: rental_pwd
      TZ: Asia/Shanghai
    volumes:
      - backupdata:/backup
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[backup] 已启动，每 24 小时全量备份一次，保留 7 天"
        while true; do
          f=/backup/rental-$$(date +%Y%m%d-%H%M).dump
          pg_dump -h postgres -U rental -d rental -Fc -f $$f && echo "[backup] 完成 $$f"
          find /backup -name '*.dump' -mtime +7 -delete
          sleep 86400
        done

volumes:
  pgdata:
  promdata:
  grafanadata:
  registrydata:
  backupdata:
