<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>消息通知 · TokenArk 创元方舟</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css?v19">
<link rel="stylesheet" href="/console.css?v19">
</head>
<body data-active="msg">

<div class="console">
  <aside class="cs" id="cside"></aside>
  <div class="cmain">
    <div class="ctopbar"></div>
    <div class="cbody">
      <div class="msg" id="msg"></div>
      <div class="card panel">
        <h3>消息通知 <span class="s">共 <b id="cnt">0</b> 条，未读 <b id="unread">0</b> 条</span>
          <button class="ghost sm" onclick="readAll()">全部标为已读</button>
        </h3>
        <div id="list"></div>
      </div>
    </div>
  </div>
</div>

<script src="/console-nav.js?v19"></script>
<script>
const $ = s => document.querySelector(s);
const TOKEN = localStorage.getItem('gu_token') || '';
if (!TOKEN || !localStorage.getItem('gu_user')) location.replace('/login');
let ITEMS = [];

async function api(p, opt) {
  opt = opt || {};
  opt.headers = Object.assign({ Authorization: 'Bearer ' + TOKEN }, opt.headers || {});
  const r = await fetch('/api' + p, opt);
  if (r.status === 401) { location.replace('/login'); throw new Error('401'); }
  const t = await r.text();
  let j = {}; try { j = t ? JSON.parse(t) : {}; } catch (e) {}
  if (!r.ok) throw new Error(j.message || r.status);
  return j;
}
function toast(t, ok) {
  const m = $('#msg'); m.textContent = t; m.className = 'msg ' + (ok ? 'ok' : 'err');
  clearTimeout(toast._t); toast._t = setTimeout(() => m.className = 'msg', 6000);
}

function render() {
  $('#cnt').textContent = ITEMS.length;
  $('#unread').textContent = ITEMS.filter(m => !m.is_read).length;
  if (!ITEMS.length) {
    $('#list').innerHTML = '<div class="empty-state"><div class="ic">◔</div><b>暂无消息</b>' +
      '<span>下单、释放、告警等事件会在这里通知你</span></div>';
    return;
  }
  $('#list').innerHTML = ITEMS.map(m => `
    <div style="display:flex;gap:12px;padding:14px 0;border-bottom:1px dashed #f3f1f9;align-items:flex-start;
         cursor:${m.is_read ? 'default' : 'pointer'}" onclick="markOne('${m.id}')">
      <span style="width:32px;height:32px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;
            justify-content:center;background:#edf3fe;color:#5f93ff">◔</span>
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:8px">
          <b style="font-size:13px">${m.title}</b>
          <span class="pill p-gray">${m.type}</span>
          ${m.is_read ? '' : '<span style="width:6px;height:6px;border-radius:50%;background:#e5484d"></span>'}
        </div>
        <div class="hint" style="margin-top:4px">${m.body}</div>
      </div>
      <div class="hint" style="white-space:nowrap">${Tf.at(m.created_at)}</div>
    </div>`).join('');
}

async function load() {
  try {
    const r = await api('/notifications');
    ITEMS = r.items || [];
    render();
  } catch (e) { toast(e.message, false); }
}
async function markOne(id) {
  const m = ITEMS.find(x => x.id === id);
  if (!m || m.is_read) return;
  try { await api('/notifications/' + id + '/read', { method: 'POST' }); await load(); }
  catch (e) { toast(e.message, false); }
}
async function readAll() {
  try {
    const r = await api('/notifications/read-all', { method: 'POST' });
    toast(r.message, true);
    await load();
  } catch (e) { toast(e.message, false); }
}
load();
</script>
</body>
</html>
