  <div class="cmain">
    <div class="ctopbar"></div>
    <div class="ctabrow"></div>

    <div class="cbody">
      <div class="adl-pagetitle">主页看板</div>

      <div class="adl-dash">
        <!-- 左栏：容器实例 / 消费统计 / 帮助文档 -->
        <div class="adl-stack">
          <div class="adl-card">
            <h3>容器实例
              <span class="link-sm" onclick="location.href='/instances'">管理实例 &rsaquo;</span>
            </h3>
            <div class="adl-data4">
              <div class="adl-kpi"><div class="k">全部实例</div><div class="num" id="kTotal">0</div></div>
              <div class="adl-kpi"><div class="k">运行中</div><div class="num" id="kRun">0</div></div>
              <div class="adl-kpi"><div class="k">即将到期</div><div class="num orange" id="kSoon">0</div></div>
              <div class="adl-kpi"><div class="k">即将释放</div><div class="num orange" id="kRel">0</div></div>
            </div>
            <div style="margin-top:18px">
              <button class="adl-createbtn" onclick="location.href='/portal'">＋ 创建实例</button>
            </div>

          <div class="adl-card">

            </div>
            <div id="dashChart" style="display:flex;align-items:flex-end;gap:10px;height:170px"></div>
          </div>

          <div class="adl-card">
            <h3>帮助文档
              <span class="link-sm" onclick="Biz.assistant()">AI 问答 &rsaquo;</span>
            </h3>
            <a class="hrow" href="/instances">
              <span class="hi b"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg></span>
              <span><b>快速开始</b><span>创建第一个实例</span></span>
            </a>
            <a class="hrow" href="/portal">
              <span class="hi g"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/></svg></span>
              <span><b>GPU选型</b><span>选择适合您的GPU</span></span>
            </a>
            <a class="hrow" href="/index#docs">
              <span class="hi c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></span>
              <span><b>功能导览</b><span>查看平台功能</span></span>
            </a>
          </div>
        </div>

        <!-- 右栏：账号信息 / 邀请赠送 -->
        <div class="adl-stack">
          <div class="adl-card">
            <div class="adl-idhead"><span id="wName">—</span><span class="adl-badge green">租户</span></div>
            <div style="font-size:13px;color:var(--adl-text3);margin-bottom:14px"><span id="greet">早安</span>，欢迎回来</div>
            <div class="adl-balbox">
              <div class="t"><span>账户总余额</span>
                <button class="adl-recharge" onclick="location.href='/recharge'">充值</button></div>
              <div id="balTotal"><i>¥</i>0</div>
            </div>
            <div class="adl-couponrow"><span>现金余额</span><b id="balCash"><i>¥</i>0</b></div>
            <div class="adl-couponrow"><span>代金券余额 <span class="link-sm" onclick="location.href='/coupons'">券包</span></span><b id="balCoupon"><i>¥</i>0</b></div>
            <div class="adl-couponrow"><span>模型调用消费 <span class="link-sm" onclick="maasUsage()">明细</span></span><b id="balMaas"><i>¥</i>0</b></div>
          </div>

          <div class="adl-card">
            <h3>邀请赠送
              <span class="link-sm" onclick="inviteRecords()">邀请记录 &rsaquo;</span>
            </h3>
            <div class="inv-hero" id="invHero">🎉 邀请好友注册并首充，双方都能拿到代金券</div>
            <div class="codebox">
              <div class="cw">
                <div class="lbl">我的邀请码</div>
                <div class="cd" id="invCode">————</div>
              </div>
              <button onclick="copyInvite()">复制邀请链接</button>
            </div>
            <div class="notes" id="invNotes">
              好友通过你的邀请码注册并首次充值达标即自动发券：被邀请人得 <span class="r" id="noteInvitee">5元</span>代金券，你得 <span class="r" id="noteInviter">3元</span>返券；代金券 <span class="r" id="noteDays">有效期三个月</span>，请及时使用。
            </div>
            <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
              <button class="dpill orange" onclick="Biz.ticket({title:'联系客服',subject:'邀请活动咨询',extra:'客服会以工单形式回复，进度在「工单」页可查。'})">联系客服</button>
              <button class="dpill green" onclick="Biz.ticket({title:'技术交流群',subject:'申请加入技术交流群',content:'希望加入技术交流群，接收镜像更新与活动通知。',extra:'提交后管理员会在工单里回复群二维码或邀请链接。'})">技术交流群</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<button class="float2" title="在线客服" onclick="Biz.ticket({title:'在线客服',subject:'咨询：',extra:'提交后进入平台工单队列，客服回复会推送到「消息中心」。'})">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
</button>

<script src="/user-menu.js?v46"></script>
<script src="/console-nav.js?v46"></script>
<script src="/biz.js?v46"></script>
<script>
const $ = s => document.querySelector(s);
const TOKEN = localStorage.getItem('gu_token') || '';
const U = JSON.parse(localStorage.getItem('gu_user') || 'null');
if (!TOKEN || !U) location.replace('/login');
const TENANT = U.tenantId || 't1';
const h = new Date().getHours();
$('#greet').textContent = h < 6 ? '凌晨好' : h < 12 ? '早安' : h < 18 ? '下午好' : '晚上好';
$('#wName').textContent = U.displayName || U.username;

async function api(p) {
  const r = await fetch('/api' + p, { headers: { Authorization: 'Bearer ' + TOKEN } });
  if (r.status === 401) { location.replace('/login'); throw new Error('401'); }
  const t = await r.text();
  let j = {}; try { j = t ? JSON.parse(t) : {}; } catch (e) {}
  if (!r.ok) throw new Error(j.message || r.status);
  return j;
}
const fmtT = t => {
  if (!t) return '-';
  const d = new Date(String(t).replace(' ', 'T'));
  return isNaN(d) ? String(t) : d.toLocaleString('zh-CN', { hour12: false });
};
function copyText(text, what) {
  const done = () => Biz.toast((what || '内容') + '已复制', 'ok');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => prompt('手动复制：', text));
  } else { prompt('手动复制：', text); }
}

/* ---------------- 邀请赠送 ----------------
 * 邀请码、已邀请人数、返券记录全部来自 GET /api/invite（真库），注册链接直达 /login?tab=register&invite= */
let INV = null;
async function loadInvite() {
  try {
    INV = await api('/invite');
    $('#invCode').textContent = INV.code || '————';
    const r = INV.rule || {};
    $('#invHero').innerHTML = '🎉 新人首次充值满 <span class="em">' + Biz.esc(r.minRecharge || '1')
      + '元</span> 送 <span class="em">' + Biz.esc(r.rewardInvitee || '5') + '元</span> 代金券，邀请好友再赚 <span class="em">'
      + Biz.esc(r.rewardInviter || '3') + '元</span>！';
    $('#noteInvitee').textContent = (r.rewardInvitee || '5') + '元';
    $('#noteInviter').textContent = (r.rewardInviter || '3') + '元';
    $('#noteDays').textContent = '有效期 ' + (r.couponDays || 90) + ' 天';
  } catch (e) {
    $('#invCode').textContent = '加载失败';
    console.error(e);
  }
}
function inviteUrl() {
  return location.origin + (INV && INV.registerUrl ? INV.registerUrl : '/login?tab=register');
}
function copyInvite() {
  if (!INV || !INV.code) return Biz.toast('邀请码还没加载出来，请稍后再试', 'err');
  copyText(inviteUrl(), '邀请链接');
}
/** 邀请记录：谁通过我的码注册了、返券到账没有，一条一条列出来 */
function inviteRecords() {
  Biz.modal({
    title: '邀请记录', wide: true, hideOk: true, cancelText: '关闭',
    html: '<div class="biz-sum"><span class="hint">我的邀请码</span>' +
            '<b class="mono" style="font-size:14px">' + Biz.esc((INV && INV.code) || '—') + '</b></div>' +
          '<div class="biz-rows" id="ivList"><div class="biz-empty">加载中…</div></div>',
    tip: '好友用你的邀请码注册后会出现在这里；对方首次充值满门槛，双方代金券由系统自动发放，不用找人领。',
    ready: async box => {
      const list = box.querySelector('#ivList');
      try {
        const d = await api('/invite');
        INV = d;
        const rows = (d.invited || []).map(u =>
          '<div class="biz-row"><div class="t"><b>' + Biz.esc(u.display_name || u.username) + '</b>' +
            '<span class="biz-tag ' + (u.invite_rewarded ? 'ok' : '') + '">' +
            (u.invite_rewarded ? '已返券' : '待首充') + '</span></div>' +
            '<div class="d mono">@' + Biz.esc(u.username) + ' · 注册于 ' + Biz.esc(fmtT(u.created_at)) + '</div></div>').join('');
        const rewards = (d.rewards || []).map(c =>
          '<div class="biz-row"><div class="t"><b>' + Biz.esc(c.title) + '</b>' +
            '<span class="biz-tag ' + (c.status === 'unused' ? 'ok' : '') + '">' + Biz.esc(c.status === 'unused' ? '未使用' : c.status) + '</span></div>' +
            '<div class="d">¥' + Number(c.amount_yuan || 0).toFixed(2) + ' · ' + Biz.esc(fmtT(c.expire_at)) + ' 到期</div></div>').join('');
        list.innerHTML =
          '<div class="biz-empty" style="padding-bottom:6px">已邀请 ' + (d.invitedCount || 0) +
            ' 人，其中 ' + (d.rewardedCount || 0) + ' 人完成首充</div>' +
          (rows || '<div class="biz-empty">还没有人通过你的邀请码注册，把下面的链接发出去试试。</div>') +
          (rewards ? '<div class="biz-empty" style="padding:10px 0 6px">返券明细</div>' + rewards : '');
      } catch (e) { list.innerHTML = '<div class="biz-empty">加载失败：' + Biz.esc(e.message) + '</div>'; }
    }
  });
}

/* ---------------- 模型调用消费 ----------------
 * 大模型 API 按 Token 计量后直接扣现金余额，这里展示真实账单而不是虚构的「模型钱包」 */
function maasUsage() {
  Biz.modal({
    title: '模型调用明细', wide: true, hideOk: true, cancelText: '关闭',
    html: '<div class="biz-rows" id="muList"><div class="biz-empty">加载中…</div></div>',
    tip: '数据来自 MaaS 网关的真实计量记录（最近 100 条）。消费直接从现金余额扣除，平台没有独立的模型钱包，因此也没有「余额划转」这一步。',
    ready: async box => {
      const list = box.querySelector('#muList');
      try {
        const d = await api('/maas/usage');
        const items = d.items || [];
        list.innerHTML = items.length
          ? '<div class="biz-empty" style="padding-bottom:6px">累计消费 ¥' + Number(d.total || 0).toFixed(4) + '</div>' +
            items.map(r =>
              '<div class="biz-row"><div class="t"><b>' + Biz.esc(r.model) + '</b>' +
                '<span class="biz-tag">¥' + Number(r.amount_yuan || 0).toFixed(4) + '</span></div>' +
                '<div class="d mono">输入 ' + r.prompt_tokens + ' tok · 输出 ' + r.completion_tokens +
                ' tok · ' + Biz.esc(fmtT(r.created_at)) + '</div></div>').join('')
          : '<div class="biz-empty">还没有模型调用记录。到「大模型 API」页创建密钥并调用一次，这里就会出现账单。</div>';
      } catch (e) { list.innerHTML = '<div class="biz-empty">加载失败：' + Biz.esc(e.message) + '</div>'; }
    }
  });
}

/* ---------------- 消费统计 ----------------
 * 近 7 天 GPU 结算金额，来自 /api/billing/daily（真库），无消费的日子显示为 0 而不是编造曲线 */
async function loadDashChart() {
  const box = $('#dashChart');
  if (!box) return;
  try {
    const daily = await api('/billing/daily?tenantId=' + TENANT + '&days=7');
    const byDay = {};
    (daily || []).forEach(x => { byDay[String(x.d).slice(0, 10)] = Number(x.amount) || 0; });
    const key = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const days = [];
    for (let i = 6; i >= 0; i--) days.push(new Date(Date.now() - i * 86400000));
    const max = Math.max(...days.map(d => byDay[key(d)] || 0), 1);
    box.innerHTML = days.map(d => {
      const k = key(d), v = byDay[k] || 0;
      const h = v > 0 ? Math.max(6, Math.round(v / max * 120)) : 3;
      return `<div style="flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px">
        <span style="font-size:11px;color:var(--adl-text3);height:15px">${v > 0 ? '¥' + v.toFixed(2) : ''}</span>
        <div style="width:100%;max-width:46px;height:${h}px;border-radius:2px 2px 0 0;background:${v > 0 ? 'var(--adl-blue)' : 'var(--adl-line2)'}"></div>
        <span style="font-size:11px;color:var(--adl-text3);height:15px">${k.slice(5)}</span>
      </div>`;
    }).join('');
  } catch (e) {
    box.innerHTML = '<div style="color:var(--adl-text3);font-size:13px;align-self:center;margin:auto">消费数据加载失败</div>';
  }
}

(async function () {
  loadInvite();
  loadDashChart();
  try {
    const [list, tenants, coupons, usage] = await Promise.all([
      api('/instances?tenantId=' + TENANT), api('/tenants'), api('/coupons'), api('/maas/usage')
    ]);
    const running = list.filter(i => i.status === 'running');
    const soon = list.filter(i => i.expire_at && (new Date(i.expire_at) - Date.now()) < 86400000 && i.status !== 'released');
    $('#kTotal').textContent = list.length;
    $('#kRun').textContent = running.length;
    $('#kSoon').textContent = soon.length;
    $('#kRel').textContent = list.filter(i => i.status === 'releasing').length;

    const me = tenants.find(t => t.id === TENANT) || {};
    const bal = Number(me.balance_yuan) || 0;
    const couponBal = (coupons || []).filter(c => c.status === 'unused')
      .reduce((a, c) => a + (Number(c.amount_yuan) || 0), 0);
    $('#balTotal').innerHTML = '<i>¥</i>' + (bal + couponBal).toFixed(2);
    $('#balCash').innerHTML = '<i>¥</i>' + bal.toFixed(2);
    $('#balCoupon').innerHTML = '<i>¥</i>' + couponBal.toFixed(2);
    $('#balMaas').innerHTML = '<i>¥</i>' + Number(usage.total || 0).toFixed(4);
  } catch (e) { console.error(e); }
})();
</script>
