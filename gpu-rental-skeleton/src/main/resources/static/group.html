<main class="grid-bg">
  <div class="wrap" style="padding:44px 24px 20px;text-align:center">
    <div class="h1-xl" style="font-size:44px">多人拼团 <span class="grad-text">共享算力</span></div>
    <div class="lead-2" style="margin:14px auto 0;text-align:center">
      针对大显存需求（如模型微调、推理）推出拼团服务。<br>
      一台服务器多人共享显存，资源隔离，价格更优。
    </div>
  </div>

  <div class="wrap" style="padding-bottom:26px">
    <div class="steps">
      <div class="step"><div class="n">1</div><b>选择配置</b><span>挑选合适的 GPU 型号</span></div>
      <div class="step"><div class="n">2</div><b>提交信息</b><span>支付拼团预付款</span></div>
      <div class="step"><div class="n">3</div><b>等待成团</b><span>邀请好友或等待其他同学</span></div>
      <div class="step"><div class="n">4</div><b>拼团成功</b><span>获取机器信息</span></div>
    </div>
  </div>

  <div class="wrap" style="padding-bottom:60px">
    <div class="filter-card">
      <div class="filter-row">
        <div class="filter-label">GPU 型号</div>

      <div class="filter-row">

      </div>

    <div class="toolbar">
      <div class="tool-left"><span class="hint">共 <b id="cnt">0</b> 个拼团中</span></div>
      <div class="tool-right">
        <span class="hint">价格排序</span>
        <select id="sort" style="width:110px;height:32px;font-size:12px" onchange="render()">
          <option value="default">默认</option>
          <option value="asc">从低到高</option>
          <option value="desc">从高到低</option>

</main>

<footer style="border-top:1px solid #f3eefc;background:#fff">
  <div class="wrap" style="padding:26px 24px;display:flex;justify-content:space-between;gap:20px;
       flex-wrap:wrap;font-size:12px;color:#98a1b3">

      <div style="margin-top:6px">GPU 算力运营平台 · 私有化交付</div></div>
    <div>© 2026 TokenArk · 演示环境</div>
  </div>
</footer>

<script>
/* 页面不存业务数据：机型、库存、成团进度全部来自 /api/catalog/group */
let DATA = [];
const S = { model: '全部', vram: '全部', zone: '全部' };
const MODELS = ['全部', 'RTX5090', 'RTX4090', 'A100', 'H800', 'L40S'];
const VRAMS = ['全部', '24G', '32G', '40G', '48G', '80G'];
const ZONES = ['全部', '可用区 A', '可用区 B'];

const NV_LOGO = `<svg width="48" height="28" viewBox="0 0 48 28" role="img" aria-label="NVIDIA">
  <path d="M24 3c-8.4 0-14.6 4.3-17.6 9.4C9.4 17.5 15.6 21.8 24 21.8s14.6-4.3 17.6-9.4C38.6 7.3 32.4 3 24 3Zm0 2.6c6 0 10.7 2.7 13.4 6.8-2.7 4.1-7.4 6.8-13.4 6.8S13.3 16.5 10.6 12.4C13.3 8.3 18 5.6 24 5.6Z" fill="#76b900"/>
  <circle cx="24" cy="12.4" r="4.1" fill="#76b900"/>
  <text x="24" y="27" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
        font-size="7" font-weight="700" fill="#76b900" letter-spacing=".3">NVIDIA</text></svg>`;
const PIN_IC = `<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2">
  <path d="M6 10.6S2.4 7.6 2.4 4.9a3.6 3.6 0 1 1 7.2 0c0 2.7-3.6 5.7-3.6 5.7Z"/>
  <circle cx="6" cy="4.9" r="1.1"/></svg>`;

function specCell(cls, icon, label, value) {
  return `<div class="xc-spec ${cls}"><span class="i">${icon}</span>${label} <b>${value}</b></div>`;
}

function opts(list, key) {
  return list.map(x => `<span class="opt ${S[key] === x ? 'on' : ''}" onclick="pick('${key}','${x}')">${x}</span>`).join('');
}
function pick(k, v) { S[k] = v; renderFilters(); render(); }
function renderFilters() {
  document.getElementById('fModel').innerHTML = opts(MODELS, 'model');
  document.getElementById('fVram').innerHTML = opts(VRAMS, 'vram');
  document.getElementById('fZone').innerHTML = opts(ZONES, 'zone');
}

function groupCard(d) {
  const pct = Math.round(d.done / d.total * 100);
  return `<div class="xcard">
    <div class="xc-brand">${NV_LOGO}</div>
    <div class="xc-main">
      <div class="xc-head">
        <span class="xc-title">${d.model}</span>
        <span class="xc-zone">${PIN_IC}${d.zone}</span>
        <span style="font-size:10px;color:#9aa2b1">已拼 ${d.done} / ${d.total} 人</span>
      </div>
      <div class="xc-specs">
        ${specCell('pink', '▤', '显存', d.vram + ' GB')}
        ${specCell('purple', '▦', '核心数', d.vcpu + ' 核')}
        ${specCell('violet', '▣', 'CPU', d.cpu || '—')}
        ${specCell('blue', '▥', '内存', d.ram + ' GB')}
        ${specCell('amber', '▧', '系统盘', d.disk + 'G SSD')}
        ${specCell('blue', '◫', '数据盘', d.dataDisk || '—')}
      </div>
      <div class="xc-extra">
        <div class="xc-prog-txt"><span>成团进度</span><span>${pct}% · 还差 ${d.total - d.done} 人</span></div>
        <div class="xc-prog"><i style="width:${pct}%"></i></div>
      </div>
    </div>
    <div class="xc-buy">
      <div class="lb">月租 / 卡</div>
      <div class="xc-price">¥${Number(d.price).toLocaleString('en-US')}</div>
      <button class="xc-btn" onclick="join('${d.model} ${d.vram}G')">立即拼单</button>
    </div>
  </div>`;
}

function render() {
  let list = DATA.filter(d =>
    (S.model === '全部' || d.model === S.model) &&
    (S.vram === '全部' || d.vram + 'G' === S.vram) &&
    (S.zone === '全部' || d.zone === S.zone));
  const sort = document.getElementById('sort').value;
  if (sort === 'asc') list.sort((a, b) => a.price - b.price);
  if (sort === 'desc') list.sort((a, b) => b.price - a.price);
  document.getElementById('cnt').textContent = list.length;
  document.getElementById('grid').innerHTML = list.length
    ? list.map(groupCard).join('')
    : `<div class="card panel"><div class="empty">没有符合条件的拼团</div></div>`;
}

function join(name) {
  alert(`演示环境：已选择「${name}」拼团。\n真实流程需接入支付与成团逻辑，当前仅展示交互。`);
}

async function load() {
  try {
    const r = await fetch('/api/catalog/group');
    DATA = await r.json();
  } catch (e) {
    DATA = [];
  }
  renderFilters(); render();
}
load();
</script>
<script src="/nav.js?v10"></script>
</body>
</html>
