<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的镜像 · TokenArk 创元方舟</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/console.css">
</head>
<body data-active="img">

<div class="console">
  <aside class="cs" id="cside"></aside>
  <div class="cmain">
    <div class="ctopbar"><div class="ctabs" id="ctabs"></div></div>
    <div class="cbody">
      <div class="card panel">
        <h3>我的镜像 <span class="s">预置环境，开箱即用</span>
          <button class="sm" onclick="tip('新建镜像')">新建镜像</button>
        </h3>
        <div id="list"></div>
      </div>
      <div class="card panel" style="margin-top:14px">
        <h3>拉取命令</h3>
        <div class="hint">私有仓库地址：<code class="mono">registry.local:5000</code>，集群内可直接拉取；集群外需先登录。</div>
        <pre class="mono" style="background:#fbfbfe;border:1px solid #f3f1f9;border-radius:10px;padding:12px;margin-top:10px;overflow:auto">docker pull registry.local:5000/tokenark/pytorch:2.4-cuda12.4</pre>
      </div>
    </div>
  </div>
</div>

<script src="/console-nav.js"></script>
<script>
const IMGS = [
  { n: 'pytorch', t: '2.4-cuda12.4', size: '9.2 GB', desc: 'PyTorch 2.4 + CUDA 12.4 + cuDNN', tag: '推荐' },
  { n: 'tensorflow', t: '2.16-gpu', size: '7.8 GB', desc: 'TensorFlow 2.16 GPU 版', tag: '' },
  { n: 'vllm', t: '0.6.3', size: '12.4 GB', desc: 'vLLM 推理加速，支持 OpenAI 协议', tag: '推理' },
  { n: 'ollama', t: '0.3.12', size: '3.1 GB', desc: '本地模型推理运行时', tag: '' },
  { n: 'jupyter', t: '4.2-lab', size: '2.6 GB', desc: 'JupyterLab 交互式开发环境', tag: '开发' },
  { n: 'cuda', t: '12.4-base', size: '1.9 GB', desc: 'CUDA 基础镜像，自行安装依赖', tag: '基础' }
];
document.getElementById('list').innerHTML = `<table>
  <thead><tr><th>镜像</th><th>版本</th><th>大小</th><th>说明</th><th>状态</th><th style="text-align:right">操作</th></tr></thead>
  <tbody>${IMGS.map(i => `<tr>
    <td><b class="mono">${i.n}</b> ${i.tag ? `<span class="pill p-purple">${i.tag}</span>` : ''}</td>
    <td class="mono">${i.t}</td>
    <td>${i.size}</td>
    <td class="hint">${i.desc}</td>
    <td><span class="pill p-green">已同步</span></td>
    <td style="text-align:right"><button class="sm ghost" onclick="tip('拉取 ${i.n}:${i.t}')">拉取</button></td>
  </tr>`).join('')}</tbody></table>`;
function tip(n) { alert('演示环境：' + n + ' 需要接入镜像仓库，当前仅展示目录。'); }
</script>
</body>
</html>
