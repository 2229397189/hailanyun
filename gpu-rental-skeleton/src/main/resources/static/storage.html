<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件存储 · TokenArk 创元方舟</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css?v10">
<link rel="stylesheet" href="/console.css?v10">
</head>
<body data-active="store">

<div class="console">
  <aside class="cs" id="cside"></aside>
  <div class="cmain">
    <div class="ctopbar"></div>
    <div class="cbody">
      <h2 style="font-size:20px;font-weight:750;letter-spacing:-.01em;margin-bottom:6px">文件存储</h2>
      <div class="hint" style="margin-bottom:12px">
        ⚠ 文件存储按量计费，免费额度 <b>20GB</b>；实例挂载路径为
        <code class="mono">/root/venv-mind-h</code>。欠费或长期未使用将回收空间。
      </div>

      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
        <span class="opt on" style="font-size:11.5px">可用区 A</span>
        <span class="opt" style="font-size:11.5px">可用区 B</span>
        <span class="opt" style="font-size:11.5px">华东</span>
        <span class="opt" style="font-size:11.5px">华南</span>
      </div>

      <div class="card panel mb10" style="padding:16px 18px">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div class="quota-head">0 GB <small>/ 0 GB</small></div>
          <div class="hint">今日流量 <b>0 GB</b> · 预估花费 <b>¥0</b></div>
        </div>
        <div class="quota-bar"><i style="width:0%"></i></div>
        <div class="hint" style="display:flex;gap:18px">
          <span>● 免费已用 0 GB</span><span>● 付费已用 0 GB</span>
        </div>
      </div>

      <div class="card" style="overflow:hidden">
        <div style="display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #f4f0f9">
          <span class="hint" style="margin-right:auto">文件 / 文件夹</span>
          <button class="ghost sm" onclick="tip('新建文件夹')">新建文件夹</button>
          <button class="sm pink-btn" onclick="tip('上传文件')">上传</button>
        </div>
        <div style="display:flex;align-items:center;gap:16px;padding:9px 16px;border-bottom:1px solid #f8f5fc;
             font-size:11px;color:#98a1b3">
          <span style="flex:1">名称</span><span style="width:120px">大小</span>
          <span style="width:170px">更新时间</span><span style="width:80px;text-align:right">操作</span>
        </div>
        <div class="empty-state">
          <div class="ic">▧</div>
          <b>该区域暂无存储空间</b>
          <span>如需开通请联系客服</span>
          <div><button class="btn-pink" onclick="tip('联系客服')">联系客服</button></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/console-nav.js?v10"></script>
<script>
function tip(n) { alert('演示环境：' + n + ' 需要接入对象存储。'); }
</script>
</body>
</html>
