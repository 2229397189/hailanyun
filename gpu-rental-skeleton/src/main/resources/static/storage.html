<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件存储 · TokenArk 创元方舟</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css?v17">
<link rel="stylesheet" href="/console.css?v17">
</head>
<body data-active="store">

<div class="console">
  <aside class="cs" id="cside"></aside>
  <div class="cmain">
    <div class="ctopbar"></div>
    <div class="cbody">
      <div class="msg" id="msg"></div>
      <h2 style="font-size:20px;font-weight:750;letter-spacing:-.01em;margin-bottom:6px">文件存储</h2>
      <div class="hint" style="margin-bottom:12px">
        ⚠ 文件存储按量计费，免费额度 <b>20GB</b>；实例挂载路径为
        <code class="mono">/root/venv-mind-h</code>。欠费或长期未使用将回收空间。
      </div>

      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px" id="zones">
        <span class="opt on" style="font-size:11.5px" data-zone="可用区 A" onclick="pickZone(this)">可用区 A</span>
        <span class="opt" style="font-size:11.5px" data-zone="可用区 B" onclick="pickZone(this)">可用区 B</span>
        <span class="opt" style="font-size:11.5px" data-zone="华东" onclick="pickZone(this)">华东</span>
        <span class="opt" style="font-size:11.5px" data-zone="华南" onclick="pickZone(this)">华南</span>
      </div>

      <div class="card panel mb10" style="padding:16px 18px">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div class="quota-head" id="qhead">0 GB <small>/ 20 GB</small></div>
          <div class="hint">今日流量 <b>0 GB</b> · 预估花费 <b>¥0</b></div>
        </div>
        <div class="quota-bar"><i id="qbar" style="width:0%"></i></div>
        <div class="hint" style="display:flex;gap:18px">
          <span id="qfree">● 免费已用 0 GB</span><span>● 付费已用 0 GB</span>
        </div>
      </div>

      <div class="card" style="overflow:hidden">
        <div style="display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #f4f0f9">
          <input id="newName" placeholder="文件 / 文件夹名称"
                 style="flex:1;height:32px;border:1px solid #eee9f8;border-radius:8px;padding:0 12px;font-size:12px"
                 onkeydown="if(event.key==='Enter')newFolder()">
          <span class="hint" style="white-space:nowrap">大小 GB</span>
          <input id="newSize" type="number" min="0" step="0.1" value="0" placeholder="0"
                 style="width:64px;height:32px;border:1px solid #eee9f8;border-radius:8px;padding:0 8px;font-size:12px">
          <button class="ghost sm" onclick="newFolder()">新建文件夹</button>
          <button class="sm pink-btn" onclick="uploadFile()">上传</button>
        </div>
        <div style="display:flex;align-items:center;gap:16px;padding:9px 16px;border-bottom:1px solid #f8f5fc;
             font-size:11px;color:#98a1b3">
          <span style="flex:1">名称</span><span style="width:120px">大小</span>
          <span style="width:170px">更新时间</span><span style="width:80px;text-align:right">操作</span>
        </div>
        <div id="list"><div class="empty">加载中…</div></div>
      </div>

      <div class="card" style="overflow:hidden;margin-top:12px">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
             border-bottom:1px solid #f4f0f9">
          <b style="font-size:13px">数据集库</b>
          <span class="hint">预置公共数据集，可在「实例列表 → 数据集」一键挂载到实例
            <code class="mono">/root/datasets</code>（演示环境登记台账，真实集群为 PVC 挂载）</span>
        </div>
        <div style="display:flex;align-items:center;gap:16px;padding:9px 16px;border-bottom:1px solid #f8f5fc;
             font-size:11px;color:#98a1b3">
          <span style="flex:1">数据集</span><span style="width:90px">类别</span>
          <span style="width:90px">大小</span><span style="width:130px">样本数</span>
          <span style="width:170px">来源</span>
        </div>
        <div id="dsList"><div class="empty">加载中…</div></div>
      </div>
    </div>
  </div>
</div>

<script src="/console-nav.js?v17"></script>
<script>
const $ = s => document.querySelector(s);
const TOKEN = localStorage.getItem('gu_token') || '';
if (!TOKEN || !localStorage.getItem('gu_user')) location.replace('/login');
let ZONE = '可用区 A';

async function api(p, opt) {
  opt = opt || {};
  opt.headers = Object.assign({ Authorization: 'Bearer ' + TOKEN }, opt.headers || {});
  const r = await fetch('/api' + p, opt);
  if (r.status === 401) { location.replace('/login'); throw new Error('401'); }
  const t = await r.text();
  let j = {}; try { j = t ? JSON.parse(t) : {}; } catch (e) {}
  if (!r.ok) throw new Error(j.message || r.status);
  return j;
}
function toast(t, ok) {
  const m = $('#msg'); m.textContent = t; m.className = 'msg ' + (ok ? 'ok' : 'err');
  clearTimeout(toast._t); toast._t = setTimeout(() => m.className = 'msg', 6000);
}
function pickZone(el) {
  document.querySelectorAll('#zones .opt').forEach(x => x.classList.toggle('on', x === el));
  ZONE = el.dataset.zone;
  load();
}

function render(rows, used, free) {
  const usedN = Number(used) || 0, freeN = Number(free) || 20;
  $('#qhead').innerHTML = usedN.toFixed(1) + ' GB <small>/ ' + freeN + ' GB</small>';
  $('#qbar').style.width = Math.min(100, usedN / freeN * 100) + '%';
  $('#qfree').textContent = '● 免费已用 ' + usedN.toFixed(1) + ' GB';
  const box = $('#list');
  if (!rows.length) {
    box.innerHTML = '<div class="empty-state">' +
      '<div class="ic">▧</div><b>该区域暂无文件</b>' +
      '<span>新建文件夹或上传文件后在这里管理</span></div>';
    return;
  }
  box.innerHTML = rows.map(r => `
    <div style="display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid #f8f5fc;font-size:12px">
      <span style="flex:1">${r.is_dir ? '▦' : '▤'} <b>${r.name}</b></span>
      <span style="width:120px" class="hint">${r.is_dir ? '—' : (Number(r.size_gb) || 0).toFixed(2) + ' GB'}</span>
      <span style="width:170px" class="hint">${Tf.at(r.updated_at)}</span>
      <span style="width:80px;text-align:right">
        <button class="sm ghost" onclick="del('${r.id}')">删除</button></span>
    </div>`).join('');
}

async function load() {
  try {
    const r = await api('/storage?zone=' + encodeURIComponent(ZONE));
    render(r.items || [], r.usedGb, r.freeGb);
  } catch (e) { $('#list').innerHTML = '<div class="empty">' + e.message + '</div>'; }
}
async function newFolder() {
  const name = $('#newName').value.trim();
  if (!name) { toast('请填写文件夹名称', false); return; }
  try {
    const r = await api('/storage', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, zone: ZONE, isDir: true })
    });
    $('#newName').value = '';
    toast(r.message, true);
    await load();
  } catch (e) { toast(e.message, false); }
}
async function uploadFile() {
  const name = $('#newName').value.trim();
  if (!name) { toast('请填写文件名（演示环境只登记元数据，不上传真实对象）', false); return; }
  const size = Number($('#newSize').value);
  try {
    const r = await api('/storage', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, zone: ZONE, isDir: false, sizeGb: isFinite(size) ? size : 0 })
    });
    $('#newName').value = '';
    toast(r.message, true);
    await load();
  } catch (e) { toast(e.message, false); }
}
async function del(id) {
  if (!confirm('确认删除该条目？')) return;
  try { await api('/storage/' + id, { method: 'DELETE' }); await load(); }
  catch (e) { toast(e.message, false); }
}

async function loadDatasets() {
  try {
    const rows = await api('/datasets');
    if (!rows.length) { $('#dsList').innerHTML = '<div class="empty">暂无数据集</div>'; return; }
    $('#dsList').innerHTML = rows.map(d => `
      <div style="display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid #f8f5fc;font-size:12px">
        <span style="flex:1"><b>${d.name}</b><div class="hint">${d.description || ''}</div></span>
        <span style="width:90px"><span class="pill p-blue">${d.category || '—'}</span></span>
        <span style="width:90px" class="hint">${d.size_gb || 0} GB</span>
        <span style="width:130px" class="hint">${d.samples || '—'}</span>
        <span style="width:170px" class="hint">${d.source || '—'}</span>
      </div>`).join('');
  } catch (e) { $('#dsList').innerHTML = '<div class="empty">' + e.message + '</div>'; }
}
load();
loadDatasets();
</script>
</body>
</html>
