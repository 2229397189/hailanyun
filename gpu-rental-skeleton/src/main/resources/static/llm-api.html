<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大模型 API · TokenArk 创元方舟</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css?v46">
<link rel="stylesheet" href="/console.css?v46">
<link rel="stylesheet" href="/brand.css?v46">
<link rel="stylesheet" href="/autodl.css?v46">
</head>
<body data-active="llm" class="adl console-page">

<div class="console">
  <aside class="cs" id="cside"></aside>
  <div class="cmain">
    <div class="ctopbar"></div>
    <div class="cbody">
      <div class="msg" id="msg"></div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <h2 style="font-size:20px;font-weight:750;letter-spacing:-.01em">大模型 API</h2>
        <a class="hint" href="/index" style="color:#1d54c4">返回使用 ›</a>
      </div>
      <div class="hint" style="margin-bottom:12px">模型额度统一管理，调用费用只从模型余额扣除。</div>

      <div class="card panel">
        <h3 style="justify-content:flex-start;gap:8px">
          <span style="width:22px;height:22px;border-radius:6px;background:#f2f6fd;color:#1d54c4;
                display:inline-flex;align-items:center;justify-content:center;font-size:11px">✦</span>
          模型额度
          <span class="hint" style="font-weight:400;margin-left:4px">使用前请确保已充值，代金券不可抵扣</span>
        </h3>
        <div style="display:flex;align-items:center;margin-top:8px">
          <div style="flex:1;text-align:center">
            <div class="hint">可用余额</div>
            <div style="font-size:26px;font-weight:750;color:#1d54c4;margin-top:6px" id="mbal">¥ 0</div>
            <div class="hint" style="font-size:10px;margin-top:4px">不含代金券</div>
          </div>
          <div style="width:1px;height:54px;background:#eef2f9"></div>
          <div style="flex:1;text-align:center">
            <div class="hint">模型余额</div>
            <div style="font-size:26px;font-weight:750;color:#1d54c4;margin-top:6px" id="ubal">¥ 0</div>
            <div class="hint" style="font-size:10px;margin-top:4px">模型调用计费</div>
          </div>
          <div style="flex:1;text-align:right">
            <button class="pink-btn" style="height:34px;padding:0 20px;border-radius:8px;font-size:12.5px"
                    onclick="location.href='/recharge'">去充值</button>
          </div>
        </div>
      </div>

      <div class="card panel" style="margin-top:14px">
        <h3>API 密钥 <span class="s">兼容 OpenAI 协议</span></h3>
        <div class="hint" style="margin-bottom:10px">
          接口地址：<code class="mono">http://&lt;本机地址:8099&gt;/v1/chat/completions</code>，
          网关按 Token 计量并直接从上方模型余额扣费，密钥用 <code class="mono">Authorization: Bearer sk-…</code> 传入。
        </div>
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <input id="newName" placeholder="密钥名称（例如：本地调试）"
                 style="flex:1;height:34px;border:1px solid #e9eff8;border-radius:8px;padding:0 12px;font-size:12.5px"
                 onkeydown="if(event.key==='Enter')createKey()">
          <button class="sm pink-btn" onclick="createKey()">新建密钥</button>
        </div>
        <div id="list"></div>
      </div>

      <div class="card panel" style="margin-top:14px">
        <h3>模型目录 <span class="s">单价 / 百万 Token</span></h3>
        <table>
          <thead><tr><th>模型</th><th>说明</th><th style="text-align:right">输入</th><th style="text-align:right">输出</th></tr></thead>
          <tbody id="mlist"><tr><td colspan="4" class="hint">加载中…</td></tr></tbody>
        </table>
      </div>

      <div class="card panel" style="margin-top:14px">
        <h3>调用记录 <span class="s">近 100 条 · 费用实时扣减</span></h3>
        <div id="usage"></div>
      </div>
    </div>
  </div>
</div>

<script src="/user-menu.js?v46"></script>
<script src="/console-nav.js?v46"></script>
<script>
const $ = s => document.querySelector(s);
const TOKEN = localStorage.getItem('gu_token') || '';
const U = JSON.parse(localStorage.getItem('gu_user') || 'null');
if (!TOKEN || !U) location.replace('/login');
const fmt = n => (Number(n) || 0).toFixed(2);
let KEYS = [];

async function api(p, opt) {
  opt = opt || {};
  opt.headers = Object.assign({ Authorization: 'Bearer ' + TOKEN }, opt.headers || {});
  const r = await fetch('/api' + p, opt);
  if (r.status === 401) { location.replace('/login'); throw new Error('401'); }
  const t = await r.text();
  let j = {}; try { j = t ? JSON.parse(t) : {}; } catch (e) {}
  if (!r.ok) throw new Error(j.message || r.status);
  return j;
}
function toast(t, ok) {
  const m = $('#msg'); m.textContent = t; m.className = 'msg ' + (ok ? 'ok' : 'err');
  clearTimeout(toast._t); toast._t = setTimeout(() => m.className = 'msg', 6000);
}

function render() {
  const box = document.getElementById('list');
  if (!KEYS.length) {
    box.innerHTML = '<div class="empty-state"><div class="ic">✦</div><b>暂无密钥</b>' +
      '<span>创建后即可调用模型</span></div>';
    return;
  }
  box.innerHTML = '<table><thead><tr><th>名称</th><th>密钥</th><th>创建时间</th><th>状态</th>' +
    '<th style="text-align:right">操作</th></tr></thead><tbody>' +
    KEYS.map(function (k) {
      return '<tr><td>' + k.name + '</td>' +
        '<td class="mono">' + k.prefix + '••••••••</td>' +
        '<td class="hint">' + (k.created_at ? Tf.day(k.created_at) : '') + '</td>' +
        '<td><span class="pill ' + (k.status === 'on' ? 'p-green' : 'p-gray') + '">' +
        (k.status === 'on' ? '启用' : '停用') + '</span></td>' +
        '<td style="text-align:right">' +
        '<button class="sm ghost" onclick="toggle(\'' + k.id + '\')">' +
        (k.status === 'on' ? '停用' : '启用') + '</button> ' +
        '<button class="sm danger" onclick="del(\'' + k.id + '\')">删除</button></td></tr>';
    }).join('') + '</tbody></table>';
}

async function load() {
  try {
    KEYS = await api('/api-keys');
    render();
    const tenants = await api('/tenants');
    const me = tenants.find(t => t.id === U.tenantId) || {};
    const b = Number(me.balance_yuan) || 0;
    $('#ubal').textContent = '¥ ' + fmt(b);
    $('#mbal').textContent = '¥ ' + fmt(b);
    loadModels();
    loadUsage();
  } catch (e) { toast(e.message, false); }
}

async function loadModels() {
  try {
    const r = await api('/maas/models');
    $('#mlist').innerHTML = (r.items || []).map(function (m) {
      return '<tr><td class="mono">' + m.id + '</td><td class="hint">' + m.display + '</td>' +
        '<td style="text-align:right">' + price(m.inPerM) + '</td>' +
        '<td style="text-align:right">' + price(m.outPerM) + '</td></tr>';
    }).join('');
  } catch (e) {}
}

async function loadUsage() {
  try {
    const r = await api('/maas/usage');
    const box = document.getElementById('usage');
    if (!(r.items || []).length) {
      box.innerHTML = '<div class="empty-state"><div class="ic">✦</div><b>暂无调用记录</b>' +
        '<span>用 API 密钥调用一次模型后这里会显示明细</span></div>';
      return;
    }
    box.innerHTML = '<table><thead><tr><th>时间</th><th>模型</th><th style="text-align:right">输入 Token</th>' +
      '<th style="text-align:right">输出 Token</th><th style="text-align:right">费用</th></tr></thead><tbody>' +
      r.items.map(function (u) {
        return '<tr><td class="hint">' + fmtTs(u.created_at) + '</td>' +
          '<td class="mono">' + u.model + '</td>' +
          '<td style="text-align:right">' + u.prompt_tokens + '</td>' +
          '<td style="text-align:right">' + u.completion_tokens + '</td>' +
          '<td style="text-align:right" class="mono">' + fmtAmt(u.amount_yuan) + '</td></tr>';
      }).join('') + '</tbody></table>';
  } catch (e) {}
}

function fmtTs(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return String(s).slice(0, 10);
  const p = n => String(n).padStart(2, '0');
  return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function fmtAmt(v) {
  const n = Number(v) || 0;
  return n > 0 && n < 0.01 ? '¥ ' + n.toFixed(4) : '¥ ' + fmt(n);
}

function price(v) {
  return Number(v) > 0 ? ('¥ ' + Number(v).toFixed(2)) : '<span class="pill p-green">限免</span>';
}

async function createKey() {
  if (KEYS.length >= 5) { toast('最多创建 5 个密钥', false); return; }
  const name = $('#newName').value.trim();
  if (!name) { toast('请填写密钥名称', false); return; }
  try {
    const r = await api('/api-keys', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name })
    });
    $('#newName').value = '';
    toast(r.message + '（完整 key：' + r.key + '）', true);
    await load();
  } catch (e) { toast(e.message, false); }
}
async function toggle(id) {
  try { await api('/api-keys/' + id + '/toggle', { method: 'POST' }); await load(); }
  catch (e) { toast(e.message, false); }
}
async function del(id) {
  if (!confirm('确认删除该密钥？删除后调用立即失效。')) return;
  try { await api('/api-keys/' + id, { method: 'DELETE' }); await load(); }
  catch (e) { toast(e.message, false); }
}
load();
</script>
</body>
</html>
