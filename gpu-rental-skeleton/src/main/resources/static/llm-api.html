<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大模型 API · TokenArk 创元方舟</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/console.css">
</head>
<body data-active="llm">

<div class="console">
  <aside class="cs" id="cside"></aside>
  <div class="cmain">
    <div class="ctopbar"><div class="ctabs" id="ctabs"></div></div>
    <div class="cbody">
      <div class="card panel mb10">
        <h3>接口地址 <span class="s">兼容 OpenAI 协议</span></h3>
        <pre class="mono" style="background:#fbfbfe;border:1px solid #f3f1f9;border-radius:10px;padding:12px;margin:0;overflow:auto">POST https://api.tokenark.local/v1/chat/completions
Authorization: Bearer sk-你的密钥</pre>
        <div class="hint" style="margin-top:8px">演示环境未部署模型网关，接口地址为占位。</div>
      </div>

      <div class="card panel">
        <h3>API 密钥 <span class="s">最多创建 5 个</span>
          <button class="sm" onclick="createKey()">新建密钥</button>
        </h3>
        <div id="list"></div>
      </div>

      <div class="grid g3" style="margin-top:14px">
        <div class="card panel"><div class="ck2"><div class="k">今日调用</div>
          <div class="v">0<small> 次</small></div></div></div>
        <div class="card panel"><div class="ck2"><div class="k">今日 Token</div>
          <div class="v">0<small> k</small></div></div></div>
        <div class="card panel"><div class="ck2"><div class="k">今日消费</div>
          <div class="v">¥0.00</div></div></div>
      </div>
    </div>
  </div>
</div>

<script src="/console-nav.js"></script>
<script>
const $ = s => document.querySelector(s);
const U = JSON.parse(localStorage.getItem('gu_user') || 'null');
if (!localStorage.getItem('gu_token') || !U) location.replace('/login.html');
const KEY = 'gu_api_keys_' + U.username;
let keys = JSON.parse(localStorage.getItem(KEY) || '[]');
if (!keys.length) {
  keys = [{ id: 'sk-' + Math.random().toString(36).slice(2, 10), name: '默认密钥', created: '2026-11-03', status: 'on' }];
  localStorage.setItem(KEY, JSON.stringify(keys));
}
function render() {
  $('#list').innerHTML = `<table>
    <thead><tr><th>名称</th><th>密钥</th><th>创建时间</th><th>状态</th><th style="text-align:right">操作</th></tr></thead>
    <tbody>${keys.map((k, i) => `<tr>
      <td>${k.name}</td>
      <td class="mono">${k.id.slice(0, 8)}••••••••</td>
      <td class="hint">${k.created}</td>
      <td><span class="pill ${k.status === 'on' ? 'p-green' : 'p-gray'}">${k.status === 'on' ? '启用' : '停用'}</span></td>
      <td style="text-align:right">
        <button class="sm ghost" onclick="toggle(${i})">${k.status === 'on' ? '停用' : '启用'}</button>
        <button class="sm danger" style="margin-left:4px" onclick="del(${i})">删除</button>
      </td>
    </tr>`).join('')}</tbody></table>`;
}
function save() { localStorage.setItem(KEY, JSON.stringify(keys)); render(); }
function createKey() {
  if (keys.length >= 5) { alert('最多创建 5 个密钥'); return; }
  const name = prompt('给密钥起个名字（例如：本地调试）');
  if (!name) return;
  keys.push({ id: 'sk-' + Math.random().toString(36).slice(2, 12), name: name, created: new Date().toISOString().slice(0, 10), status: 'on' });
  save();
}
function toggle(i) { keys[i].status = keys[i].status === 'on' ? 'off' : 'on'; save(); }
function del(i) { if (confirm('确认删除该密钥？删除后调用立即失效。')) { keys.splice(i, 1); save(); } }
render();
</script>
</body>
</html>
