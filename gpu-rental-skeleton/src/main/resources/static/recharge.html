<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在线充值 · TokenArk 创元方舟</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css?v13">
<link rel="stylesheet" href="/console.css?v13">
<style>
.recharge{max-width:720px;margin:0 auto}
.amt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.amt{border:1px solid #eee9f8;border-radius:11px;padding:14px;text-align:center;cursor:pointer;
  font-size:14px;font-weight:600;color:#374151;transition:.15s;position:relative;background:#fff}
.amt:hover{border-color:#d9c6ff}
.amt.on{border-color:#a855f7;background:#faf5ff;color:#6d28d9;box-shadow:0 0 0 3px rgba(168,85,247,.12)}
.amt.on::after{content:"✓";position:absolute;right:9px;top:7px;font-size:10px;color:#a855f7}
.pay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pay{display:flex;align-items:center;gap:9px;border:1px solid #eee9f8;border-radius:10px;
  padding:12px;font-size:12.5px;cursor:pointer;background:#fff}
.pay.on{border-color:#a855f7;background:#faf5ff}
.pay i{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-style:normal;color:#fff}
.summary{display:flex;justify-content:space-between;font-size:12.5px;padding:9px 0;color:#5b6478}
.summary b{color:#111}
.pay-btn{width:100%;height:44px;border-radius:11px;font-size:14px;font-weight:600;margin-top:6px}
</style>
</head>
<body data-active="recharge">

<div class="console">
  <aside class="cs" id="cside"></aside>
  <div class="cmain">
    <div class="ctopbar"><div class="ctabs" id="ctabs"></div></div>
    <div class="cbody">
      <div class="recharge">
        <div class="msg" id="msg"></div>
        <div class="card panel">
          <h3>充值金额 <span class="s">充值后余额实时到账</span></h3>
          <div class="amt-grid" id="amts"></div>
          <div class="field" style="margin-top:12px">
            <label>请输入自定义金额（两位小数）</label>
            <input id="custom" type="number" min="0.01" step="0.01" placeholder="0.00" oninput="pickCustom()">
          </div>

          <h3 style="margin-top:18px">订单信息</h3>
          <div style="background:#fbfbfe;border:1px solid #f3f1f9;border-radius:11px;padding:6px 14px">
            <div class="summary"><span>账户总余额</span><b id="bal">¥0.00</b></div>
            <div class="summary"><span>充值金额</span><b id="amt" style="color:#7c3aed">¥50.00</b></div>
            <div class="summary"><span>充值后余额</span><b id="after">¥50.00</b></div>
          </div>

          <h3 style="margin-top:18px">支付方式</h3>
          <div class="pay-grid">
            <div class="pay on" data-pay="微信支付" onclick="pickPay(this)"><i style="background:#22c55e">微</i>微信支付</div>
            <div class="pay" data-pay="支付宝" onclick="pickPay(this)"><i style="background:#3b82f6">支</i>支付宝</div>
            <div class="pay" data-pay="对公汇款" onclick="pickPay(this)"><i style="background:#8b5cf6">公</i>对公汇款</div>
          </div>

          <button class="pay-btn" style="margin-top:18px" onclick="pay()">立即支付</button>
          <div class="hint" style="text-align:center;margin-top:10px">
            演示环境：点击后模拟到账，不产生真实扣款。
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/console-nav.js?v13"></script>
<script>
const $ = s => document.querySelector(s);
const fmt = n => (Number(n) || 0).toFixed(2);
const TOKEN = localStorage.getItem('gu_token') || '';
const U = JSON.parse(localStorage.getItem('gu_user') || 'null');
if (!TOKEN || !U) location.replace('/login.html');
const TENANT = U.tenantId || 't1';
let BALANCE = 0, AMOUNT = 50;

const PRESETS = [50, 100, 200, 500, 1000, 2000];
$('#amts').innerHTML = PRESETS.map(v =>
  `<div class="amt ${v === 50 ? 'on' : ''}" data-v="${v}" onclick="pickAmt(${v},this)">¥ ${v}</div>`).join('');

function pickAmt(v, el) {
  AMOUNT = v; $('#custom').value = '';
  document.querySelectorAll('.amt').forEach(x => x.classList.toggle('on', x === el));
  refresh();
}
function pickCustom() {
  const v = Number($('#custom').value);
  AMOUNT = isFinite(v) && v > 0 ? v : 0;
  document.querySelectorAll('.amt').forEach(x => x.classList.remove('on'));
  refresh();
}
function pickPay(el) { document.querySelectorAll('.pay').forEach(x => x.classList.toggle('on', x === el)); }
function refresh() {
  $('#amt').textContent = '¥' + fmt(AMOUNT);
  $('#after').textContent = '¥' + fmt(BALANCE + AMOUNT);
}
function toast(t, ok) {
  const m = $('#msg'); m.textContent = t; m.className = 'msg ' + (ok ? 'ok' : 'err');
  clearTimeout(toast._t); toast._t = setTimeout(() => m.className = 'msg', 6000);
}
function pay() {
  if (AMOUNT <= 0) { toast('请输入充值金额', false); return; }
  const way = document.querySelector('.pay.on').dataset.pay;
  BALANCE += AMOUNT;
  $('#bal').textContent = '¥' + fmt(BALANCE);
  refresh();
  toast('模拟支付成功：' + way + ' ¥' + fmt(AMOUNT) + ' 已到账（演示环境未真实扣款）', true);
}

(async function () {
  try {
    const r = await fetch('/api/tenants', { headers: { Authorization: 'Bearer ' + TOKEN } });
    const list = await r.json();
    const me = list.find(t => t.id === TENANT) || {};
    BALANCE = Number(me.balance_yuan) || 0;
    $('#bal').textContent = '¥' + fmt(BALANCE);
    refresh();
  } catch (e) { refresh(); }
})();
</script>
</body>
</html>
