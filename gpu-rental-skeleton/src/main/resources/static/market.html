<main class="rm-page">

  </div>

  <div class="rm-filter">
    <div class="rm-frow first"><label class="rm-flabel">计费方式</label><div class="rm-opts" id="fBilling"></div></div>
    <div class="rm-frow"><label class="rm-flabel">选择地区</label><div class="rm-opts" id="fZone"></div></div>
    <div class="rm-frow"><label class="rm-flabel">GPU型号</label><div class="rm-opts" id="fModel"></div></div>
    <div class="rm-frow last"><label class="rm-flabel">资源类型</label><div class="rm-opts" id="fKind"></div></div>
  </div>

  <div class="rm-toolbar">
    <div class="rm-tool-left">
      <span class="market-count" id="mCount">正在读取资源池…</span>
      <span class="rm-divider"></span>
      <button class="rm-trigger rm-stock" type="button" id="onlyStock" onclick="toggleStock()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
        <span>只看有货</span>

<script src="/user-menu.js?v46"></script>
<script src="/nav.js?v46"></script>
<script>
(function () {
  'use strict';

  var BILLING = [
    { k: 'hour', t: '按量计费', key: 'hourly', unit: '/时' },
    { k: 'day',  t: '包日',     key: 'day',    unit: '/日' },
    { k: 'week', t: '包周',     key: 'week',   unit: '/周' },
    { k: 'month',t: '包月',     key: 'month',  unit: '/月' }
  ];
  var S = { billing: 'hour', zone: '全部', model: '全部', kind: '全部', onlyStock: false, sort: 'default' };
  var ALL = [];
  var ZONES = [], MODELS = [];

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function num(v) {
    var n = Number(v);
    if (!isFinite(n) || n <= 0) return '—';
    return n % 1 === 0 ? n.toFixed(0) : n.toFixed(2).replace(/0$/, '');
  }
  function billing() {
    for (var i = 0; i < BILLING.length; i++) if (BILLING[i].k === S.billing) return BILLING[i];
    return BILLING[0];
  }

  function seg(id, list, cur, fn) {
    document.getElementById(id).innerHTML = list.map(function (x) {
      var val = typeof x === 'string' ? x : x.k;
      var txt = typeof x === 'string' ? x : x.t;
      return '<button class="adl-seg' + (val === cur ? ' on' : '') + '" type="button" ' +
             'onclick="MKT.' + fn + "('" + val + "')" + '">' + txt + '</button>';
    }).join('');
  }

  function renderFilters() {
    seg('fBilling', BILLING, S.billing, 'setBilling');
    seg('fZone', ['全部'].concat(ZONES), S.zone, 'setZone');
    seg('fModel', ['全部'].concat(MODELS), S.model, 'setModel');
    seg('fKind', ['全部', 'GPU', 'CPU'], S.kind, 'setKind');
    document.getElementById('fSort').innerHTML = [
      { k: 'default', t: '综合排序' },
      { k: 'price', t: '价格' },
      { k: 'vram', t: '显存' }
    ].map(function (x) {
      return '<button class="adl-sort' + (S.sort === x.k ? ' on' : '') + '" type="button" ' +
             'onclick="MKT.setSort(\'' + x.k + '\')">' + x.t + '</button>';
    }).join('');
  }

  function card(d) {
    var sold = !!d.soldOut;
    var bg = (d.brand === 'amd' || d.brand === 'intel') ? d.brand : 'nvidia';
    var disk = esc(d.dataDisk || '—') + (d.dataExpand ? ' · ' + esc(d.dataExpand) : '');
    var buy = sold
      ? '<button class="gc-btn warn" type="button" onclick="MKT.notify(\'' + esc(d.model) + '\')">到货提醒</button>'
      : '<button class="gc-btn" type="button" onclick="location.href=\'/portal\'">立即创建</button>';

    return '<div class="adl-gcard">' +
      '<div class="gc-top">' +
        '<span class="gc-logo"><img src="/img/' + bg + '.svg" alt=""></span>' +
        '<div class="gc-title">' +
          '<h3>' + esc(d.model) + (d.vram ? '<span class="gc-vram">' + d.vram + 'G</span>' : '') + '</h3>' +
          '<div class="gc-zone"><i>◉</i>' + esc(d.zone) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="gc-dash"></div>' +
      '<div class="gc-alloc">' + esc(d.alloc || '1 x GPU 分配') + '</div>' +
      '<div class="gc-grid">' +
        '<div><span>vCPU</span><b>' + esc(d.vcpu) + ' 核心</b></div>' +
        '<div><span>内存</span><b>' + esc(d.ram) + ' GB</b></div>' +
        '<div><span>系统盘</span><b>' + esc(d.sysDisk) + ' GB</b></div>' +
        '<div><span>数据盘</span><b>' + disk + '</b></div>' +
      '</div>' +
      '<div class="gc-foot">' +
        '<div class="gc-periods">' +
          '<div><span>包日</span><b>¥' + num(d.day) + '</b></div>' +
          '<div><span>包周</span><b>¥' + num(d.week) + '</b></div>' +
          '<div><span>包月</span><b>¥' + num(d.month) + '</b></div>' +
        '</div>' +
        '<div class="gc-now"><span>按量</span><b>¥' + num(d.hourly) + '<i>/时</i></b></div>' +
        buy +
      '</div>' +
    '</div>';
  }

  function render() {
    var list = ALL.slice();
    if (S.zone !== '全部') list = list.filter(function (d) { return d.zone === S.zone; });
    if (S.model !== '全部') list = list.filter(function (d) { return d.model === S.model; });
    if (S.kind !== '全部') list = list.filter(function (d) { return d.kind === S.kind; });
    if (S.onlyStock) list = list.filter(function (d) { return !d.soldOut; });

    if (S.sort === 'price') {
      var key = billing().key;
      list.sort(function (a, b) { return (Number(a[key]) || 0) - (Number(b[key]) || 0); });
    } else if (S.sort === 'vram') {
      list.sort(function (a, b) { return (Number(b.vram) || 0) - (Number(a.vram) || 0); });
    }

    document.getElementById('mCount').innerHTML =
      '共 <b>' + list.length + '</b> 个规格 · 数据来自资源池实时目录';
    document.getElementById('productGrid').innerHTML = list.length
      ? list.map(card).join('')
      : '<div class="rm-empty">当前筛选条件下没有可用规格，换个条件试试</div>';
  }

  function load() {
    fetch('/api/catalog/market')
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (d) {
        ALL = Array.isArray(d) ? d : [];
        var zs = {}, ms = {};
        ALL.forEach(function (x) { if (x.zone) zs[x.zone] = 1; if (x.model) ms[x.model] = 1; });
        ZONES = Object.keys(zs);
        MODELS = Object.keys(ms);
        renderFilters();
        render();
      })
      .catch(function () {
        document.getElementById('mCount').textContent = '资源池暂不可用';
        document.getElementById('productGrid').innerHTML =
          '<div class="rm-empty">资源池暂时不可用，请稍后刷新</div>';
      });
  }

  window.MKT = {
    setBilling: function (v) { S.billing = v; renderFilters(); render(); },
    setZone: function (v) { S.zone = v; renderFilters(); render(); },
    setModel: function (v) { S.model = v; renderFilters(); render(); },
    setKind: function (v) { S.kind = v; renderFilters(); render(); },
    setSort: function (v) { S.sort = v; renderFilters(); render(); },
    notify: function (model) {
      alert(model + ' 当前已售罄。可以先到「控制台 → 资源申请」提交需求，到货后优先通知你。');
    }
  };

  window.toggleStock = function () {
    S.onlyStock = !S.onlyStock;
    var b = document.getElementById('onlyStock');
    b.classList.toggle('on', S.onlyStock);
    render();
  };

  load();
})();
</script>
</body>
</html>
