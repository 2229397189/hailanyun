server:
  port: 8099

spring:
  application:
    name: gpu-rental-skeleton
  datasource:
    url: jdbc:postgresql://postgres:5432/rental
    driver-class-name: org.postgresql.Driver
    username: rental
    password: rental_pwd
  sql:
    init:
      mode: never
      encoding: UTF-8

logging:
  level:
    root: warn
    com.example.rental: info

rental:
  k8s:
    mode: ${RENTAL_K8S_MODE:fake}
    kubeconfig: ${RENTAL_KUBECONFIG:/kubeconfig}
    image: ${RENTAL_K8S_IMAGE:busybox:1.36}
    deleteWaitMs: 6000

# 可观测性：Prometheus 抓取端点（/actuator/prometheus）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: gpu-rental
