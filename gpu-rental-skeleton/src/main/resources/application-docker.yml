server:
  port: 8099

spring:
  application:
    name: gpu-rental-skeleton
  datasource:
    url: jdbc:postgresql://postgres:5432/rental
    driver-class-name: org.postgresql.Driver
    username: rental
    password: rental_pwd
  sql:
    init:
      mode: never
      encoding: UTF-8

logging:
  level:
    root: warn
    com.example.rental: info

rental:
  k8s:
    # fake=模拟 / real=真 K8s 集群 / local=本机 Docker 引擎（真实 GPU 容器）
    mode: ${RENTAL_K8S_MODE:fake}
    kubeconfig: ${RENTAL_KUBECONFIG:/kubeconfig}
    image: ${RENTAL_K8S_IMAGE:busybox:1.36}
    deleteWaitMs: 6000
    # local 模式：控制平面通过 docker.sock 管理本机 GPU 容器
    # 只在 RENTAL_K8S_MODE=local 时被 LocalDockerK8s 读取，其它模式无副作用
    local:
      socket: ${RENTAL_DOCKER_SOCKET:/var/run/docker.sock}
      image: ${RENTAL_LOCAL_IMAGE:nvidia/cuda:12.4.0-base-ubuntu22.04}
      gpu-image: ${RENTAL_LOCAL_GPU_IMAGE:nvidia/cuda:12.4.0-base-ubuntu22.04}
      # WSL2 把 Windows NVIDIA 驱动库挂到 /usr/lib/wsl，容器内 nvidia-smi/CUDA 需要它
      wsl-lib: ${RENTAL_WSL_LIB:/usr/lib/wsl}
      expose-ports: ${RENTAL_EXPOSE_PORTS:22,8888,8080,6006,7860,3000,6080}
      memory-mb: ${RENTAL_INSTANCE_MEMORY_MB:4096}
      cpus: ${RENTAL_INSTANCE_CPUS:4}
  prometheus:
    # 同一 compose 网络里的 Prometheus；容器名即主机名
    url: ${RENTAL_PROMETHEUS_URL:http://gpu-rental-prom:9090}

# 可观测性：Prometheus 抓取端点（/actuator/prometheus）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: gpu-rental
